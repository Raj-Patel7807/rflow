spring:
  application:
    name: api-gateway

  datasource:
    url: jdbc:postgresql://localhost:5432/rflow_gateway
    username: postgres
    password: DATABASE_PASSWORD

  sql:
    init:
      mode: always

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
