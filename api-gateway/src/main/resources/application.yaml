spring:
  application:
    name: api-gateway

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: never

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://rflow-lovat.vercel.app,http://localhost:5173,http://127.0.0.1:5173}

kind: Application
