spring:
  application:
    name: api-gateway

  datasource:
    url: <YOUR DB_URL>
    username: <YOUR DB_USERNAME>
    password: <YOUR DB_PASSWORD>

  sql:
    init:
      mode: never

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,<YOUR FRONTEND_URL>}
