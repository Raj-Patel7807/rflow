spring:
  application:
    name: api-gateway

  datasource:
    url: jdbc:postgresql://localhost:5432/rflow_gateway
    username: postgres
    password: DATABASE_PASSWORD

  sql:
    init:
      mode: never

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
